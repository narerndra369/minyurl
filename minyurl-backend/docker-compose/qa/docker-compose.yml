services:
  minyurldb:
    image: mysql:8.0
    container_name: minyurldb
    ports:
      - "3306:3306"
    extends:
      file: common-config.yml
      service: db-config
    environment:
      MYSQL_DATABASE: minyurl
      MYSQL_ROOT_PASSWORD: root

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      timeout: 10s
      retries: 10
    extends:
      file: common-config.yml
      service: network-deploy-service

  configserver:
    image: "minyurl/configserver:latest"
    container_name: configserver
    ports:
      - "8050:8050"
    healthcheck:
      test: "curl --fail --silent localhost:8050/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: base-config

  eurekaserver:
    image: "minyurl/eurekaserver:latest"
    container_name: eurekaserver
    ports:
      - "8060:8060"
    depends_on:
      configserver:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8060/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: configserver-config

  generateserver:
    image: "minyurl/generate:latest"
    container_name: generateserver
    ports:
      - "8070:8070"
    depends_on:
      eurekaserver:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8070/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: eurekaserver-config
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CLOUD_CONFIG_OVERRIDE_SYSTEM_PROPERTIES: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8060/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://minyurldb:3306/minyurl?createDatabaseIfNotExist=true

  redirectserver:
    image: "minyurl/redirect:latest"
    container_name: redirectserver
    ports:
      - "8080:8080"
    depends_on:
      eurekaserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8080/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: eurekaserver-config
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CLOUD_CONFIG_OVERRIDE_SYSTEM_PROPERTIES: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8060/eureka/
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATASOURCE_URL: jdbc:mysql://minyurldb:3306/minyurl?createDatabaseIfNotExist=true

  gatewayserver:
    image: "minyurl/gateway:latest"
    container_name: gatewayserver
    ports:
      - "9000:9000"
    depends_on:
      generateserver:
        condition: service_healthy
      redirectserver:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:9000/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: eurekaserver-config
    environment: # 👈 Added explicitly to fix the override drop issue
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CLOUD_CONFIG_OVERRIDE_SYSTEM_PROPERTIES: "true"
      SPRING_DATA_REDIS_HOST: redis
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8060/eureka/

networks:
  minyurl:
    driver: bridge
